#
# sops encrypts every secrets/*.sops.yaml to the maintainer's age key, for
# use on their own machines only. Nothing in CI decrypts these files: the
# workflows take their secrets from the environments, set by hand.
creation_rules:
  - path_regex: (^|/)secrets/[^/]+\.sops\.yaml$
    age: age10ef6lafmvtk8myhsl28a79zz3463f6xupf8vxx5uduyptmtxmunq4v8nvm
