# Main, applied. A fresh plan every time: a PR's plan is never reused.
name: apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  apply:
    name: apply
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Only main may deploy here, which is what keeps the read-write state
    # key off every other branch.
    environment: apply
    concurrency:
      group: tofu
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # checkout
    # Credentials are passed to each step that needs them, never set for
    # the whole job, so the toolchain install and the token action see none.
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only what this job runs: every other tool in mise.toml would be one
      # more download executing next to the admin token.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: aqua:opentofu/opentofu core:go

      # From this commit, before the App token exists, and with no
      # credentials in its environment.
      - name: Build infra-settings
        run: go build -o .bin/ ./cmd/infra-settings

      - id: token
        # Org-wide with the App's full permissions, which is what managing the
        # org takes; .github/zizmor.yml says why zizmor's github-app audit is
        # set aside here.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: divbast

      - name: Refuse an empty token
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: ': "${GITHUB_TOKEN:?the App token is empty}"'

      - name: Initialise
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
        run: tofu init -input=false -lockfile=readonly

      - name: Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
          TF_VAR_renovate_app_client_id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          TF_VAR_renovate_app_private_key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: tofu plan -input=false -out=tfplan

      - name: Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
          TF_VAR_renovate_app_client_id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          TF_VAR_renovate_app_private_key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: tofu apply -input=false tfplan

      # What the provider cannot manage, set through the REST API. It reads
      # the repositories from tofu output -json itself, which needs the
      # state's credentials, and fails on an output it cannot read.
      - name: Set the settings outside the provider
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: .bin/infra-settings

      - name: Summarise
        if: always()
        env:
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
        run: |
          if [ -f tfplan ]; then
            {
              echo '<details><summary>Applied plan</summary>'
              echo
              echo '```'
              tofu show -no-color tfplan
              echo '```'
              echo '</details>'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
