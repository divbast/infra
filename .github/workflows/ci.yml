# Every gate, with no secrets, through divbast/ci's lint.yml: just setup,
# then just lint, which inits tofu with -backend=false.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    uses: divbast/ci/.github/workflows/lint.yml@51aba8dedb3f933246d7ecc7497c879f6aa6941a # v1.32.0
    permissions:
      contents: read # checkout

  # The one check the ruleset requires beside plan, so adding a job never
  # means editing the ruleset. A skipped required check counts as passing,
  # so this runs always and treats skipped and cancelled as failure.
  required:
    name: required
    needs: [lint]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [ "${result}" != success ]; then
              echo "a required job ended ${result}" >&2
              exit 1
            fi
          done
